name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate JSON, shell, manifests, skills, hooks, secrets
        run: bash scripts/validate.sh

  plugin-manifest:
    name: Plugin manifest (claude CLI)
    runs-on: ubuntu-latest
    # Non-blocking: it needs npm and network access. scripts/validate.sh
    # already enforces the manifest rules in its Python fallback, so a flake
    # here never hides a real schema break.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./claude/plugin --strict
      - run: claude plugin validate . --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --exit-code 1

  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint commit messages on this PR
        run: |
          cp templates/commitlint.config.cjs commitlint.config.cjs
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
